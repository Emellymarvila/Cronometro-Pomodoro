<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFE7A9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Pomodoro</title>

    <!-- 🖼️ Pré-carrega as 3 ilustrações (mantenha os caminhos iguais aos de --ilustracao) -->
    <link rel="preload" as="image" href="pasta/tomate.png">
    <link rel="preload" as="image" href="pasta/tomate2.png">
    <link rel="preload" as="image" href="pasta/tomate3.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barrio&family=Poppins:wght@400;500;600;700&display=block" rel="stylesheet">

    <style>
        :root {
            /* 🖼️ IMAGENS — uma para cada modo */
            --ilustracao: url('pasta/tomate.png');
            --ilustracao-pausa: url('pasta/tomate2.png');
            --ilustracao-longa: url('pasta/tomate3.png');

            /* 🎨 CORES */
            --card-bg: #FFE7A9;
            --bg-page: #FFFFFF;
            --text-primary: #261A3A;
            --text-secondary: #808090;
            --accent: #FF3032;
            --btn-bg: #2a2a38;
            --btn-bg-active: #FF3032;
            --btn-border: #000000;
            --preset-bg: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            padding: max(0.75rem, env(safe-area-inset-top))
                     max(0.75rem, env(safe-area-inset-right))
                     max(0.75rem, env(safe-area-inset-bottom))
                     max(0.75rem, env(safe-area-inset-left));
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
        }

        /* Conteúdo escondido até as fontes carregarem (evita flash de fonte errada) */
        .pomodoro-card { opacity: 0; transition: opacity 0.2s ease; }
        html.fonts-ready .pomodoro-card { opacity: 1; }

        /* Sem card: o conteúdo fica direto sobre o fundo */
        .pomodoro-card {
            background: transparent;
            padding: 0;
            width: min(560px, 100%);
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(0.5rem, 1.6dvh, 1rem);
            overflow: hidden;
        }

        .mode-title {
            font-size: clamp(0.7rem, 3vw, 0.85rem);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent);
            text-align: center;
            flex-shrink: 0;
        }

        /* ⏱️ Timer — tamanho limitado pela largura E pela altura */
        .time-display {
            font-family: 'Barrio', cursive;
            font-size: clamp(2.8rem, min(20vw, 11dvh), 6rem);
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            letter-spacing: 2px;
            line-height: 1.1;
            text-align: center;
            flex-shrink: 0;
        }

        /* 🖼️ Ilustração — ocupa todo o espaço livre, sem estourar o cartão */
        .ilustracao {
            flex: 1 1 0;
            min-height: 0;
            width: 100%;
            background-image: var(--ilustracao);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.3s ease;
        }
        .ilustracao.foco   { background-image: var(--ilustracao); }
        .ilustracao.pausa  { background-image: var(--ilustracao-pausa); }
        .ilustracao.longa  { background-image: var(--ilustracao-longa); }

        /* ============================================================
           BOTÕES
           ============================================================ */
        .controls {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            flex-shrink: 0;
        }

        .btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            padding: 0 0.5rem;
            border-radius: 0.7rem;
            font-family: 'Poppins', sans-serif;
            font-size: clamp(0.68rem, 3vw, 0.8rem);
            font-weight: 600;
            color: #FFFFFF;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            min-height: 44px;
            letter-spacing: 0.3px;
            touch-action: manipulation;
            flex: 1 1 0;
            min-width: 0;
            white-space: nowrap;
        }
        .btn span { font-family: inherit; }

        .btn:active {
            transform: scale(0.96);
            background: var(--btn-bg-active);
        }

        .btn.primary {
            background: var(--accent);
            color: #FFFFFF;
            border-color: var(--accent);
        }
        .btn.primary:active {
            background: #FFFFFF;
            color: var(--accent);
        }

        #resetBtn { background: var(--btn-bg); color: #FFFFFF; border-color: var(--btn-border); }
        #resetBtn:active { background: var(--btn-bg-active); color: #FFFFFF; }

        .btn:focus-visible,
        .preset-btn:focus-visible {
            outline: 2px solid var(--text-primary);
            outline-offset: 2px;
        }

        /* ============================================================
           ÍCONES
           ============================================================ */
        .icon {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            display: inline-block;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        .icon-play {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 7px 0 7px 11px;
            border-color: transparent transparent transparent currentColor;
            margin-left: 1px;
            background: none;
        }

        .icon-pause {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: none;
        }
        .icon-pause::before,
        .icon-pause::after {
            content: '';
            display: block;
            width: 3px;
            height: 14px;
            background: currentColor;
            border-radius: 1px;
        }

        .icon-reset {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M21 12a9 9 0 1 1-3-6.7'/><polyline points='21 3 21 9 15 9'/></svg>");
        }

        .icon-skip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: none;
            color: #ffffff;
        }
        .icon-skip::before {
            content: '';
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 7px 0 7px 9px;
            border-color: transparent transparent transparent currentColor;
        }
        .icon-skip::after {
            content: '';
            width: 2px;
            height: 14px;
            background: currentColor;
            border-radius: 1px;
        }

        /* ============================================================
           PRESETS
           ============================================================ */
        .presets {
            display: flex;
            gap: 0.35rem;
            width: 100%;
            background: var(--preset-bg);
            padding: 0.3rem;
            border-radius: 0.9rem;
            flex-shrink: 0;
        }

        .preset-btn {
            background: transparent;
            border: none;
            font-family: 'Poppins', sans-serif;
            color: var(--text-secondary);
            padding: 0.4rem 0.3rem;
            border-radius: 0.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            flex: 1 1 0;
            min-width: 0;
            min-height: 44px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            line-height: 1;
            touch-action: manipulation;
        }
        .preset-btn span { font-family: inherit; }

        .preset-btn .preset-name { font-size: clamp(0.6rem, 2.6vw, 0.72rem); }

        .preset-btn .preset-time {
            font-size: clamp(0.55rem, 2.4vw, 0.65rem);
            opacity: 0.7;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .preset-btn.active { background: var(--accent); color: #FFFFFF; }
        .preset-btn.active .preset-time { opacity: 0.95; color: #FFFFFF; }
        .preset-btn:not(.active):active { background: #ececec; color: var(--text-primary); }

        /* ============================================================
           RESPONSIVIDADE
           ============================================================ */

        /* Telas muito estreitas */
        @media (max-width: 340px) {
            .btn { gap: 0.25rem; padding: 0 0.3rem; }
            .mode-title { letter-spacing: 2px; }
        }

        /* Vertical e baixo: esconde o título para sobrar espaço à ilustração */
        @media (orientation: portrait) and (max-height: 600px) {
            .mode-title { display: none; }
        }

        /* HORIZONTAL (computador, tablet ou celular deitado):
           imagem à esquerda, título/timer/botões/presets à direita */
        @media (orientation: landscape) {
            .pomodoro-card {
                width: min(980px, 100%);
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-rows: 1fr auto auto auto auto 1fr;
                grid-template-areas:
                    "ilu ."
                    "ilu title"
                    "ilu time"
                    "ilu controls"
                    "ilu presets"
                    "ilu .";
                column-gap: clamp(1rem, 4vw, 3.5rem);
                row-gap: clamp(0.5rem, 2.2dvh, 1.2rem);
            }
            .ilustracao { grid-area: ilu; width: 72%; height: 72%; min-height: 0; align-self: center; justify-self: center; }
            .mode-title { display: block; grid-area: title; }
            .time-display {
                grid-area: time;
                font-size: clamp(2.2rem, min(7vw, 14dvh), 5rem);
            }
            .controls, .presets {
                width: 100%;
                max-width: 380px;
                justify-self: center;
            }
            .controls { grid-area: controls; }
            .presets { grid-area: presets; }
            .mode-title, .time-display { justify-self: center; }
        }

        /* Horizontal baixo (celular deitado): controles mais compactos */
        @media (orientation: landscape) and (max-height: 480px) {
            .btn, .preset-btn { min-height: 40px; }
            .mode-title { font-size: 0.7rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
    <noscript><style>.pomodoro-card { opacity: 1; }</style></noscript>
</head>
<body>
    <div class="pomodoro-card">

        <div class="mode-title" id="modeTitle">FOCO</div>

        <div class="time-display" id="timeDisplay">25:00</div>

        <div class="ilustracao foco" id="ilustracao" role="img" aria-label="Ilustração do modo atual"></div>

        <div class="controls">
            <button class="btn primary" id="startPauseBtn">
                <span class="icon icon-play" id="startPauseIcon"></span>
                <span id="startPauseLabel">INICIAR</span>
            </button>
            <button class="btn" id="resetBtn">
                <span class="icon icon-reset"></span>
                <span>RESET</span>
            </button>
            <button class="btn" id="skipBtn">
                <span class="icon icon-skip"></span>
                <span>PULAR</span>
            </button>
        </div>

        <div class="presets">
            <button class="preset-btn active" data-minutes="25" data-mode="pomodoro">
                <span class="preset-name">Foco</span>
                <span class="preset-time">25 min</span>
            </button>
            <button class="preset-btn" data-minutes="5" data-mode="short">
                <span class="preset-name">Pausa</span>
                <span class="preset-time">5 min</span>
            </button>
            <button class="preset-btn" data-minutes="15" data-mode="long">
                <span class="preset-name">Longa</span>
                <span class="preset-time">15 min</span>
            </button>
        </div>
    </div>

    <script>
        (function() {
            const timeDisplay = document.getElementById('timeDisplay');
            const startPauseBtn = document.getElementById('startPauseBtn');
            const startPauseLabel = document.getElementById('startPauseLabel');
            const startPauseIcon = document.getElementById('startPauseIcon');
            const resetBtn = document.getElementById('resetBtn');
            const skipBtn = document.getElementById('skipBtn');
            const presetBtns = document.querySelectorAll('.preset-btn');
            const modeTitle = document.getElementById('modeTitle');
            const ilustracao = document.getElementById('ilustracao');

            let totalSeconds = 25 * 60;
            let remainingSeconds = totalSeconds;
            let timerInterval = null;
            let isRunning = false;
            let currentMode = 'pomodoro';
            let cycleCount = 0;

            function vibrate(pattern = 20) {
                if ('vibrate' in navigator) {
                    try { navigator.vibrate(pattern); } catch(e) {}
                }
            }

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            function updateDisplay() {
                timeDisplay.textContent = formatTime(remainingSeconds);
            }

            function updateModeUI() {
                const modeMap = { 'pomodoro': 'FOCO', 'short': 'PAUSA CURTA', 'long': 'PAUSA LONGA' };
                modeTitle.textContent = modeMap[currentMode] || 'FOCO';

                presetBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === currentMode);
                });

                ilustracao.classList.remove('foco', 'pausa', 'longa');
                if (currentMode === 'pomodoro') ilustracao.classList.add('foco');
                else if (currentMode === 'short') ilustracao.classList.add('pausa');
                else if (currentMode === 'long') ilustracao.classList.add('longa');
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                isRunning = false;
                startPauseLabel.textContent = 'INICIAR';
                startPauseIcon.className = 'icon icon-play';
            }

            function startTimer() {
                if (timerInterval) return;
                if (remainingSeconds <= 0) {
                    remainingSeconds = totalSeconds;
                    updateDisplay();
                }
                isRunning = true;
                startPauseLabel.textContent = 'PAUSAR';
                startPauseIcon.className = 'icon icon-pause';
                vibrate(15);
                timerInterval = setInterval(() => {
                    if (remainingSeconds > 0) {
                        remainingSeconds--;
                        updateDisplay();
                    }
                    if (remainingSeconds <= 0) {
                        stopTimer();
                        vibrate([200, 100, 200, 100, 300]);
                        setTimeout(() => skipTimer(true), 900);
                    }
                }, 1000);
            }

            function toggleTimer() {
                if (isRunning) { stopTimer(); vibrate(10); }
                else { startTimer(); }
            }

            function resetTimer() {
                stopTimer();
                remainingSeconds = totalSeconds;
                updateDisplay();
                vibrate(20);
            }

            function skipTimer(auto = false) {
                stopTimer();
                if (!auto) vibrate(30);

                let nextMode, nextMinutes;

                if (currentMode === 'pomodoro') {
                    cycleCount++;
                    if (cycleCount >= 4) { nextMode = 'long'; nextMinutes = 15; }
                    else { nextMode = 'short'; nextMinutes = 5; }
                } else {
                    nextMode = 'pomodoro';
                    nextMinutes = 25;
                    if (currentMode === 'long') cycleCount = 0;
                }

                setTimeout(() => {
                    setMode(nextMinutes, nextMode);
                    startTimer();
                }, 300);
            }

            function setMode(minutes, mode) {
                stopTimer();
                currentMode = mode;
                totalSeconds = minutes * 60;
                remainingSeconds = totalSeconds;
                updateDisplay();
                updateModeUI();
                vibrate(15);
            }

            function init() {
                updateDisplay();
                updateModeUI();

                startPauseBtn.addEventListener('click', toggleTimer);
                resetBtn.addEventListener('click', resetTimer);
                skipBtn.addEventListener('click', () => skipTimer(false));

                presetBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        cycleCount = 0;
                        setMode(parseInt(btn.dataset.minutes, 10), btn.dataset.mode);
                    });
                });
            }

            // Lê os caminhos das imagens direto das variáveis CSS (fonte única)
            function getImageUrls() {
                const cs = getComputedStyle(document.documentElement);
                return ['--ilustracao', '--ilustracao-pausa', '--ilustracao-longa']
                    .map(v => (cs.getPropertyValue(v).match(/url\(\s*["']?(.*?)["']?\s*\)/) || [])[1])
                    .filter(Boolean);
            }

            const preloadedImages = []; // mantém as imagens em memória
            function loadImage(url) {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(resolve);
                    img.onerror = resolve; // se falhar, não trava a tela
                    img.src = url;
                    preloadedImages.push(img);
                });
            }

            // Mostra a tela só depois das fontes E das imagens (limite de 4s)
            function showWhenReady() {
                const show = () => document.documentElement.classList.add('fonts-ready');
                const fonts = (document.fonts && document.fonts.load)
                    ? Promise.all([
                        document.fonts.load("400 1em 'Barrio'"),
                        document.fonts.load("600 1em 'Poppins'"),
                        document.fonts.load("700 1em 'Poppins'")
                    ])
                    : Promise.resolve();
                const images = Promise.all(getImageUrls().map(loadImage));
                Promise.race([
                    Promise.all([fonts, images]),
                    new Promise(r => setTimeout(r, 4000))
                ]).then(show, show);
            }

            init();
            showWhenReady();
        })();
    </script>
</body>
</html>
